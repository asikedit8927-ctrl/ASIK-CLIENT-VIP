name: Build ASIK CLIENT VIP APK

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Project
        run: |
          mkdir project
          unzip -q ASIK_CLIENT_VIP_Android_Project.zip -d project

      - name: Build APK
        run: |
          cd "$(dirname "$(find project -name gradlew -type f | head -1)")"
          chmod +x gradlew
          bash gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASIK-CLIENT-VIP-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          
