name: Build ASIK CLIENT VIP APK

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Project
        run: |
          mkdir project
          unzip -q ASIK_CLIENT_VIP_Android_Project.zip -d project

      - name: Locate Gradle Project
        run: |
          find project -type f | head -50
          find project -name build.gradle -o -name build.gradle.kts

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASIK-CLIENT-VIP-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          
